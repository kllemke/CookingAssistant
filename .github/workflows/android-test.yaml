name: Android Unit Tests

on:
  push:
    branches:
      - main
      - '18/tests/add-pipeline-for-unit-tests'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-host-tests:
    name: Android Host Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run Android host unit tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Upload HTML test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-host-test-html-report
          path: shared/build/reports/tests/testAndroidHostTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit XML results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-host-test-junit-xml
          path: shared/build/test-results/**/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
